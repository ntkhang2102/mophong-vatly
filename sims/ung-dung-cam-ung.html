// 6. LÒ NUNG CAO TẦN (lò cảm ứng)
// ====================================================================
const LO=(()=>{
  const CXL=350,KY=0.3,RK=150,RC=115,RI=98,RM=78;
  const TURNS=[178,212,246,280,314,348,382];            // tâm các vòng dây (theo trục đứng)
  const CTOP=150,CBOT=420,MBOT=404,HSOL=150,HLIQ=100;   // nồi nung, đáy kim loại, chiều cao khối rắn / lỏng
  const MAT={thep:{n:'Thép',f:1,melt:1500,c:[120,124,132]},dong:{n:'Đồng',f:0.6,melt:1085,c:[184,115,65]},gom:{n:'Thủy tinh / gốm',f:0,melt:9999,c:[186,214,222]}};
  const FREQ={1:{n:'1 kHz',k:0.6,vis:0.5,sk:0.5},10:{n:'10 kHz',k:0.82,vis:0.8,sk:0.72},100:{n:'100 kHz',k:1,vis:1.2,sk:0.9}};
  const ACC=0.6;    // nhiệt dung quy đổi (kW·s/°C) – thời gian được tua nhanh
  let st;
  const Pheat=()=>st.on&&st.ac?st.P*MAT[st.mat].f*FREQ[st.f].k:0;
  // màu kim loại nóng sáng theo nhiệt độ (gần đúng bức xạ vật đen)
  function hotColor(T,base){
    const stops=[[500,base],[650,[110,30,20]],[800,[170,35,15]],[950,[215,60,15]],[1100,[245,110,20]],[1300,[255,170,50]],[1500,[255,225,130]],[1700,[255,248,215]]];
    if(T<=500)return base;
    for(let i=1;i<stops.length;i++)if(T<=stops[i][0]){const k=(T-stops[i-1][0])/(stops[i][0]-stops[i-1][0]);return stops[i-1][1].map((v,j)=>Math.round(lerp(v,stops[i][1][j],k)))}
    return stops[stops.length-1][1];
  }
  const rgb=(c,m=1)=>`rgb(${c.map(v=>Math.round(clamp(v*m,0,255))).join(',')})`;
  return{
    id:'lo',tab:'🔥 Lò nung cao tần',title:'Lò nung cao tần (lò cảm ứng)',
    init(){st={on:true,ac:true,f:10,P:80,mat:'thep',T:25,melt:0,t:0,i:0,iPrev:0,e:0,ph:0,hist:[],ht:0,showI:true,showB:true,showE:true,showL:true}},
    controls:`<a class="back" href="lo-nung-cao-tan-3d.html" style="font-size:13.5px;font-weight:700">🧊 Mở bản 3D: xoay không gian, kéo thả kim loại vào nồi →</a>
      <div class="row"><button class="wide" data-tog="on" data-t="Tắt máy phát|Bật máy phát"></button><button class="wide" data-act="batch">Nạp mẻ mới (25 °C)</button></div>
      <div class="lbl">Dòng điện trong cuộn dây</div>
      <div class="seg" data-key="ac"><button data-v="true">∿ Xoay chiều cao tần</button><button data-v="false">⎓ Một chiều không đổi</button></div>
      <div class="lbl">Tần số dòng xoay chiều</div>
      <div class="seg" data-key="f"><button data-v="1">1 kHz</button><button data-v="10">10 kHz</button><button data-v="100">100 kHz</button></div>
      <label class="rng">Công suất máy phát<span class="v" data-show="P"></span><input type="range" data-key="P" min="20" max="100" step="5" value="80"></label>
      <div class="lbl">Vật liệu đặt trong nồi nung</div>
      <div class="seg" data-key="mat"><button data-v="thep">Thép</button><button data-v="dong">Đồng</button><button data-v="gom">Thủy tinh</button></div>
      <div class="lbl">Hiển thị</div>
      <div class="grid2" style="font-size:13px">
        <label class="chk"><input type="checkbox" data-chk="showI"> Chiều dòng điện</label>
        <label class="chk"><input type="checkbox" data-chk="showB"> Đường sức từ</label>
        <label class="chk"><input type="checkbox" data-chk="showE"> Dòng điện Fu-cô</label>
        <label class="chk"><input type="checkbox" data-chk="showL"> Chú thích</label>
      </div>`,
    show:{P:()=>st.P+' kW'},
    get:()=>st,
    act:{batch(){st.T=25;st.melt=0}},
    onChange(k){if(k==='mat'){st.T=25;st.melt=0}},
    step(dt){
      st.t+=dt;const om=TAU2*FREQ[st.f].vis;
      st.iPrev=st.i;
      // xoay chiều: i = sin ωt; một chiều: dòng tăng/giảm dần khi bật/tắt rồi giữ không đổi
      if(st.ac)st.i=st.on?Math.sin(om*st.t):st.i*Math.exp(-dt/0.12);
      else st.i+=((st.on?1:0)-st.i)*(1-Math.exp(-dt/0.35));
      st.e=-(st.i-st.iPrev)/dt/(TAU2*0.8);              // dòng Fu-cô ∝ −di/dt (định luật Lenz)
      st.ph+=dt*clamp(Math.abs(st.e)*1.2,0,1.5);
      const m=MAT[st.mat],gain=Pheat()/ACC,loss=0.006*(st.T-25)*(1+st.T/1000);
      if(st.T<m.melt||st.melt>=1){st.T+=(gain-loss)*dt;if(st.melt<1)st.T=Math.min(st.T,m.melt);st.T=clamp(st.T,25,1750)}
      if(st.T>=m.melt-0.5&&st.melt<1){const net=gain-loss;st.melt=clamp(st.melt+net*dt/320,0,1);if(st.melt>=1)st.T=m.melt+1}
      if(st.melt>0&&st.melt<1&&gain-loss<0)st.T=m.melt;   // giữ ở nhiệt độ nóng chảy khi đang chuyển thể
      st.ht+=dt;if(st.ht>0.03){st.ht=0;st.hist.push([st.i,st.e,st.T]);if(st.hist.length>170)st.hist.shift()}
    },
    draw(){
      const m=MAT[st.mat],col=hotColor(st.T,m.c),hot=clamp((st.T-550)/1000,0,1);
      const I=st.i,E=st.e,showIc=st.showI&&Math.abs(I)>0.05;
      // bệ lò
      ctx.fillStyle='#4b5563';ctx.beginPath();ctx.ellipse(CXL,448,215,215*KY,0,0,TAU2);ctx.fill();
      ctx.fillStyle='#6b7280';ctx.beginPath();ctx.ellipse(CXL,436,215,215*KY,0,0,TAU2);ctx.fill();ctx.fillRect(CXL-215,436,430,12);
      ctx.fillStyle='#9ca3af';ctx.beginPath();ctx.ellipse(CXL,436,215,215*KY,0,0,TAU2);ctx.fill();
      // nửa sau các vòng dây (khuất sau nồi)
      for(const y of TURNS){ctx.strokeStyle='#7c3f1d';ctx.lineWidth=10;ctx.beginPath();ctx.ellipse(CXL,y,RK,RK*KY,0,Math.PI,TAU2);ctx.stroke()}
      // nồi nung chịu nhiệt (vẽ nhìn xuyên qua thành nồi)
      const cg=ctx.createLinearGradient(CXL-RC,0,CXL+RC,0);cg.addColorStop(0,'#8d7b68');cg.addColorStop(.45,'#d9c8b2');cg.addColorStop(1,'#7a6857');
      ctx.fillStyle=cg;ctx.beginPath();ctx.moveTo(CXL-RC,CTOP);ctx.lineTo(CXL-RC,CBOT);ctx.ellipse(CXL,CBOT,RC,RC*KY,0,Math.PI,0,true);ctx.lineTo(CXL+RC,CTOP);ctx.closePath();ctx.fill();
      ctx.fillStyle='#3f3428';ctx.beginPath();ctx.moveTo(CXL-RI,CTOP);ctx.lineTo(CXL-RI,MBOT+6);ctx.ellipse(CXL,MBOT+6,RI,RI*KY,0,Math.PI,0,true);ctx.lineTo(CXL+RI,CTOP);ctx.closePath();ctx.fill();
      // kim loại: phần rắn và phần lỏng
      const cyl=(r,yb,yt,c,liquid)=>{const g=ctx.createLinearGradient(CXL-r,0,CXL+r,0);g.addColorStop(0,rgb(c,.62));g.addColorStop(.42,rgb(c,1.12));g.addColorStop(1,rgb(c,.55));
        ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(CXL-r,yt);ctx.lineTo(CXL-r,yb);ctx.ellipse(CXL,yb,r,r*KY,0,Math.PI,0,true);ctx.lineTo(CXL+r,yt);ctx.closePath();ctx.fill();
        ctx.fillStyle=rgb(c,liquid?1.18:1.05);ctx.beginPath();ctx.ellipse(CXL,yt,r,r*KY,0,0,TAU2);ctx.fill();
        if(liquid){ctx.strokeStyle=rgb(c,1.3);ctx.lineWidth=1.2;for(let k=1;k<=3;k++){const rr=r*(0.25*k+((st.t*0.3+k*.2)%0.25));ctx.beginPath();ctx.ellipse(CXL,yt,rr,rr*KY,0,0,TAU2);ctx.stroke()}}
        else{ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(CXL,yt,r,r*KY,0,0,TAU2);ctx.stroke()}};
      const hs=HSOL*(1-st.melt),hl=HLIQ*st.melt;
      if(hs>2)cyl(RM*(1-0.12*st.melt),MBOT,MBOT-hs,col,false);
      if(hl>2)cyl(RI-3,MBOT+2,MBOT-hl,col,true);
      const mTop=MBOT-Math.max(hs,hl),mR=hl>hs?RI-3:RM;
      // ánh sáng phát ra từ kim loại nóng
      if(hot>0){ctx.save();ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(CXL,(mTop+MBOT)/2,10,CXL,(mTop+MBOT)/2,240);
        gl.addColorStop(0,`rgba(255,${Math.round(120+100*hot)},40,${0.35*hot})`);gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(CXL-260,mTop-200,520,460);ctx.restore()}
      // thành trước của nồi (trong suốt) và vành miệng
      ctx.fillStyle='rgba(205,190,170,.22)';ctx.beginPath();ctx.moveTo(CXL-RC,CTOP);ctx.lineTo(CXL-RC,CBOT);ctx.ellipse(CXL,CBOT,RC,RC*KY,0,Math.PI,0,true);ctx.lineTo(CXL+RC,CTOP);ctx.ellipse(CXL,CTOP,RC,RC*KY,0,0,Math.PI);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#6b5a48';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(CXL-RC,CTOP);ctx.lineTo(CXL-RC,CBOT);ctx.ellipse(CXL,CBOT,RC,RC*KY,0,Math.PI,0,true);ctx.lineTo(CXL+RC,CTOP);ctx.stroke();
      ctx.fillStyle='#cdbba5';ctx.beginPath();ctx.ellipse(CXL,CTOP,RC,RC*KY,0,0,TAU2);ctx.fill();ctx.fillStyle='#2b241c';ctx.beginPath();ctx.ellipse(CXL,CTOP,RI,RI*KY,0,0,TAU2);ctx.fill();
      if(hot>0.05){ctx.fillStyle=`rgba(255,150,50,${0.45*hot})`;ctx.beginPath();ctx.ellipse(CXL,CTOP,RI,RI*KY,0,0,TAU2);ctx.fill()}
      // dòng điện Fu-cô: các vòng nằm ngang trong kim loại, dồn ra sát bề mặt khi tần số cao
      if(st.showE&&m.f>0&&Math.abs(E)>0.04){
        const A=clamp(Math.abs(E),0,1),hcol=Math.max(hs,hl);
        for(const fr of[0.22,0.5,0.78]){const y=MBOT-hcol*fr,r=mR*FREQ[st.f].sk;
          ctx.save();ctx.globalAlpha=.55*(.4+.6*A);ctx.strokeStyle='#111827';ctx.lineWidth=4.2;ctx.beginPath();ctx.ellipse(CXL,y,r,r*KY,0,0,TAU2);ctx.stroke();ctx.restore();
          swirl(CXL,y,r,r*KY,E>0,'#ff2d55',2.4,.45+.55*A,st.ph+fr);
          if(st.f!==100){const r2=r*0.55;swirl(CXL,y,r2,r2*KY,E>0,'#ff2d55',1.6,(.3+.5*A)*(st.f===1?1:.6),st.ph+fr+.3)}}
      }
      // đường sức từ: trong lòng cuộn dây thẳng đứng, khép kín bên ngoài
      const lvl=clamp(Math.abs(I),0,1),sg=I>=0?1:-1;
      if(st.showB&&lvl>0.04){
        ctx.save();ctx.lineWidth=2;const B='#2563eb',yT=108,yB=462;
        for(const k of[0,1,2]){
          const xin=[0,26,52][k],xout=[0,RK+48,RK+92][k],al=clamp(lvl*1.6-k*.25,0,1);if(al<=0)continue;
          ctx.globalAlpha=al;
          for(const s of(k?[-1,1]:[1])){
            ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=4;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(CXL+s*xin,yT);ctx.lineTo(CXL+s*xin,yB);ctx.stroke();
            ctx.strokeStyle=B;ctx.lineWidth=2;ctx.setLineDash([9,6]);ctx.beginPath();ctx.moveTo(CXL+s*xin,yT);ctx.lineTo(CXL+s*xin,yB);ctx.stroke();
            if(k){const mx=CXL+s*(xin+xout)/2,rx=(xout-xin)/2,ry=34+20*k;
              ctx.beginPath();ctx.ellipse(mx,yT,rx,ry,0,Math.PI,TAU2);ctx.stroke();ctx.beginPath();ctx.ellipse(mx,yB,rx,ry,0,0,Math.PI);ctx.stroke();
              ctx.beginPath();ctx.moveTo(CXL+s*xout,yT);ctx.lineTo(CXL+s*xout,yB);ctx.stroke()}
            ctx.setLineDash([]);
            // trong lòng cuộn: hướng lên khi i > 0; bên ngoài: hướng xuống
            for(const yy of[128,440])head(CXL+s*xin,yy,sg>0?-Math.PI/2:Math.PI/2,7,B);
            if(k)head(CXL+s*xout,285,sg>0?Math.PI/2:-Math.PI/2,7,B);
          }
        }
        ctx.restore();
      }
      // nửa trước các vòng dây: ống đồng sáng bóng
      for(const y of TURNS){
        ctx.lineCap='round';ctx.strokeStyle='#6b2f12';ctx.lineWidth=12;ctx.beginPath();ctx.ellipse(CXL,y,RK,RK*KY,0,0,Math.PI);ctx.stroke();
        ctx.strokeStyle='#c46a2f';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(CXL,y,RK,RK*KY,0,0,Math.PI);ctx.stroke();
        ctx.strokeStyle='#f6c39a';ctx.lineWidth=2.4;ctx.beginPath();ctx.ellipse(CXL,y-2,RK,RK*KY,0,.25,Math.PI-.25);ctx.stroke();ctx.lineCap='butt';
        // chiều dòng điện: i > 0 ⇒ nửa trước chạy sang phải (ngược chiều kim đồng hồ khi nhìn từ trên)
        if(showIc)for(const a of[Math.PI/2-.55,Math.PI/2+.55]){const x=CXL+RK*Math.cos(a),yy=y+RK*KY*Math.sin(a);
          const ang=Math.atan2(RK*KY*Math.cos(a),-RK*Math.sin(a))+(I>0?Math.PI:0);
          ctx.save();ctx.globalAlpha=.5+.5*clamp(Math.abs(I),0,1);head(x,yy,ang,8,'#fde047');ctx.strokeStyle='#713f12';ctx.lineWidth=1;ctx.restore()}
      }
      // dây dẫn nối máy phát (ống đồng có nước làm mát)
      const L1=[[CXL+RK,TURNS[0]],[CXL+RK+50,TURNS[0]],[610,230]],L2=[[CXL+RK,TURNS[TURNS.length-1]],[CXL+RK+50,TURNS[TURNS.length-1]],[610,330]];
      for(const L of[L1,L2]){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#6b2f12';ctx.lineWidth=11;poly(L);ctx.strokeStyle='#c46a2f';ctx.lineWidth=7;poly(L);ctx.lineCap='butt'}
      if(showIc){const d=I>0?1:-1;   // nửa trước chạy sang phải ⇒ dòng vào ở đầu dưới, ra ở đầu trên
        head(565,(TURNS[0]+230)/2+4,d>0?0:Math.PI,9,'#fde047');head(565,(TURNS[TURNS.length-1]+330)/2-2,d>0?Math.PI:0,9,'#fde047')}
      // máy phát cao tần
      ctx.fillStyle='#1f2937';rrect(610,190,180,170,12);ctx.fill();ctx.fillStyle='#374151';rrect(610,190,180,22,10);ctx.fill();
      text('MÁY PHÁT',700,236,14,'#e5e7eb','center',700);text(st.ac?'CAO TẦN':'MỘT CHIỀU',700,254,14,'#e5e7eb','center',700);
      ctx.fillStyle='#0b1324';rrect(625,270,150,52,6);ctx.fill();
      ctx.strokeStyle=st.on?'#22c55e':'#475569';ctx.lineWidth=2;ctx.beginPath();
      if(st.ac)for(let x=0;x<=120;x+=2){const y=296-14*Math.sin(x/120*TAU2*2+st.t*TAU2*FREQ[st.f].vis*(st.on?1:0))*(st.on?1:0);x?ctx.lineTo(640+x,y):ctx.moveTo(640+x,y)}
      else{ctx.moveTo(640,st.on?286:296);ctx.lineTo(760,st.on?286:296)}
      ctx.stroke();
      text(st.on?(st.ac?FREQ[st.f].n+' · '+st.P+' kW':'⎓ '+st.P+' kW'):'TẮT',700,340,13,st.on?'#86efac':'#94a3b8','center',700);
      // nhãn
      if(st.showL){
        // nhãn có đường chỉ dẫn: al='right' ⇒ chữ nằm bên trái điểm (tx,ty)
        const lab=(t,x,y,tx,ty,c='#1f2937',al='left',t2)=>{ctx.strokeStyle=c;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();
          ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill();
          const halo=(str,yy,sz,wt)=>{ctx.font=`${wt} ${sz}px "Be Vietnam Pro",sans-serif`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(229,233,240,.92)';ctx.strokeText(str,tx+(al==='left'?5:-5),yy);text(str,tx+(al==='left'?5:-5),yy,sz,c,al,wt)};
          halo(t,ty,13,700);if(t2)halo(t2,ty+17,12,600)};
        lab('Cuộn dây cảm ứng',CXL-RK-2,TURNS[0]+6,250,62,'#7c2d12','right','(ống đồng rỗng, có nước làm mát)');
        lab('Nồi nung chịu nhiệt',CXL-RC+8,CTOP+70,150,232,'#57534e','right','(không dẫn điện)');
        lab(`${m.n} cần nung`,CXL-RM+14,MBOT-50,150,330,'#111827','right');
        if(st.showE&&m.f>0&&Math.abs(E)>0.04)lab('Dòng điện Fu-cô',CXL+mR*FREQ[st.f].sk-6,MBOT-Math.max(hs,hl)*0.78,540,140,'#be123c','left');
        if(st.showB&&lvl>0.04)lab('Đường sức từ',CXL+RK+92,180,520,100,'#1d4ed8','left');
        text('Nước vào ↓ · nước ra ↑',700,380,12,'#0369a1','center',700);
      }
      // nhiệt kế
      ctx.fillStyle='#e5e7eb';rrect(860,120,22,300,11);ctx.fill();ctx.strokeStyle='#9ca3af';ctx.lineWidth=1;ctx.stroke();
      const th=clamp(st.T/1800,0,1);ctx.fillStyle=rgb(hotColor(Math.max(st.T,700),[200,40,30]));rrect(864,416-292*th,14,292*th+2,7);ctx.fill();
      if(m.melt<9000){const ym=416-292*m.melt/1800;ctx.strokeStyle='#111827';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(854,ym);ctx.lineTo(888,ym);ctx.stroke();text('nóng chảy',852,ym-10,10.5,'#111827','right',600)}
      text(Math.round(st.T)+' °C',871,436,12.5,'#111827','center',700);
    },
    chips(){const I=st.i;return[['Nguồn',st.on?(st.ac?'xoay chiều '+FREQ[st.f].n:'một chiều'):'tắt'],['Dòng cuộn dây',Math.abs(I)<0.05?'≈ 0':(st.ac?'đổi chiều liên tục':'không đổi')],['Kim loại',Math.round(st.T)+' °C','ind'],['Trạng thái',st.melt>=1?'nóng chảy':st.melt>0?'đang chảy '+Math.round(st.melt*100)+'%':'rắn','ind']]},
    res(){return[['Công suất máy phát',st.on?st.P+' kW':'0'],['Công suất nhiệt vào kim loại',fmt(Pheat(),0)+' kW'],['Nhiệt độ kim loại',Math.round(st.T)+' °C'],['Nhiệt độ nóng chảy',MAT[st.mat].melt<9000?MAT[st.mat].melt+' °C':'–']]},
    graph:{lanes:[{series:[{i:0,max:1.1,col:'#60a5fa',label:'Dòng trong cuộn dây'},{i:1,max:1.1,col:'#fb7185',label:'Dòng Fu-cô',dash:true}]},{pos:true,series:[{i:2,max:1800,col:'#fbbf24',label:'Nhiệt độ kim loại (0 – 1800 °C)'}]}]},
    hist:()=>st.hist,
    explain(){
      const m=MAT[st.mat];
      if(!st.on)return'<ol><li>Máy phát tắt: không có dòng điện trong cuộn dây ⇒ không có từ trường ⇒ không có dòng Fu-cô.</li></ol>';
      if(!st.ac)return'<ol><li>Dòng <b>một chiều không đổi</b> trong cuộn dây tạo từ trường <b>không đổi</b> (đường sức đứng yên, không đổi chiều).</li><li>Từ thông qua khối kim loại không biến thiên ⇒ <b>không có dòng Fu-cô</b> (chỉ xuất hiện chớp nhoáng lúc bật/tắt) ⇒ kim loại <b>không nóng lên</b>.</li><li>Lò nung cảm ứng bắt buộc dùng dòng xoay chiều.</li></ol>';
      let s=`<ol><li>Máy phát tạo dòng <b>xoay chiều tần số cao</b> (${FREQ[st.f].n}) trong cuộn dây ⇒ từ trường trong lòng cuộn dây <b>biến thiên và đổi chiều liên tục</b> (quan sát mũi tên đường sức).</li>`;
      if(m.f===0)return s+'<li>Thủy tinh/gốm <b>không dẫn điện</b> ⇒ không có dòng Fu-cô ⇒ không nóng lên. Nồi nung cũng làm bằng vật liệu như vậy nên bản thân nồi không bị nung bởi từ trường.</li></ol>';
      s+=`<li>Từ thông qua khối ${m.n.toLowerCase()} biến thiên ⇒ xuất hiện <b>dòng điện Fu-cô</b> chạy vòng nằm ngang trong kim loại. Theo định luật Lenz: khi dòng trong cuộn dây tăng thì dòng Fu-cô ngược chiều, khi giảm thì cùng chiều.</li>`;
      s+=`<li>Tần số càng cao, từ thông biến thiên càng nhanh ⇒ dòng Fu-cô càng mạnh và dồn ra sát bề mặt (hiệu ứng bề mặt) ⇒ nung càng nhanh. Hiện tại công suất nhiệt ≈ ${fmt(Pheat(),0)} kW.</li>`;
      s+=st.melt>=1?`<li>Kim loại đã <b>nóng chảy</b> (trên ${m.melt} °C). Lực từ còn khuấy trộn kim loại lỏng làm hợp kim đều.</li>`:st.melt>0?`<li>Đạt nhiệt độ nóng chảy ${m.melt} °C: nhiệt độ giữ nguyên trong khi kim loại chuyển dần sang thể lỏng (${Math.round(st.melt*100)}%).</li>`:`<li>Dòng Fu-cô tỏa nhiệt (định luật Joule) ⇒ kim loại nóng lên: ${Math.round(st.T)} °C, đổi màu từ xám sang đỏ, cam, vàng trắng.</li>`;
      s+='<li>Cuộn dây là ống đồng rỗng có nước chảy bên trong để làm mát, vì dòng điện trong cuộn rất lớn.</li>';
      return s+'</ol>';
    },
    notes:['Lò nung cao tần (lò cảm ứng): cuộn dây có dòng điện <b>xoay chiều tần số cao</b> bao quanh nồi nung chứa kim loại.','Từ trường biến thiên sinh ra <b>dòng điện Fu-cô</b> ngay trong khối kim loại ⇒ kim loại tự nóng lên và nóng chảy, không cần ngọn lửa.','Tần số càng cao ⇒ dòng Fu-cô càng mạnh, nung càng nhanh; dòng Fu-cô tập trung gần bề mặt kim loại.','Dòng một chiều không đổi không nung được. Vật không dẫn điện (thủy tinh, gốm, nồi nung) không bị nung nóng trực tiếp.','Ưu điểm: nung nhanh, sạch, dễ điều chỉnh nhiệt độ, kim loại lỏng được khuấy trộn đều nhờ lực từ.'],
    quiz:[
      {q:'Lò nung cao tần làm nóng chảy kim loại chủ yếu nhờ:',o:['Dòng điện Fu-cô xuất hiện trong khối kim loại','Ngọn lửa khí đốt dưới nồi nung','Dây điện trở nóng đỏ quấn quanh nồi','Tia hồng ngoại phát ra từ cuộn dây'],e:'Từ trường biến thiên của cuộn dây sinh ra dòng Fu-cô trong kim loại; dòng này tỏa nhiệt làm kim loại nóng chảy.',d:s=>{s.on=true;s.ac=true;s.mat='thep'}},
      {q:'Nếu cho dòng điện một chiều không đổi chạy qua cuộn dây của lò thì:',o:['Kim loại không nóng lên vì từ thông qua nó không biến thiên','Kim loại nóng lên nhanh hơn','Kim loại nóng lên như với dòng xoay chiều','Kim loại bị đẩy văng ra khỏi nồi'],e:'Dòng không đổi ⇒ từ trường không đổi ⇒ không có dòng Fu-cô (trừ lúc đóng/ngắt) ⇒ không sinh nhiệt.',d:s=>{s.on=true;s.ac=false;s.mat='thep';s.T=25;s.melt=0}},
      {q:'Tăng tần số dòng điện xoay chiều trong cuộn dây (giữ nguyên các yếu tố khác) thì kim loại:',o:['Nóng lên nhanh hơn vì dòng Fu-cô mạnh hơn','Nóng lên chậm hơn','Không thay đổi tốc độ nóng lên','Nguội đi'],e:'Tần số cao ⇒ từ thông biến thiên nhanh ⇒ suất điện động cảm ứng và dòng Fu-cô lớn hơn ⇒ tỏa nhiệt nhiều hơn.',d:s=>{s.on=true;s.ac=true;s.f=100;s.mat='thep';s.T=25;s.melt=0}},
      {q:'Cuộn dây của lò nung cao tần thường làm bằng ống đồng rỗng có nước chảy bên trong để:',o:['Làm mát cuộn dây vì dòng điện chạy qua rất lớn','Tăng từ trường trong lòng cuộn dây','Cung cấp nước cho kim loại nóng chảy','Giảm tần số dòng điện'],e:'Dòng điện rất lớn làm cuộn dây nóng; nước chảy trong ống đồng mang nhiệt đi, bảo vệ cuộn dây.',d:s=>{s.on=true;s.ac=true}},
      {q:'Đặt một khối thủy tinh vào lò nung cao tần đang hoạt động. Khối thủy tinh:',o:['Không nóng lên đáng kể vì không dẫn điện','Nóng chảy nhanh hơn thép','Nóng lên như thép','Bị nhiễm từ mạnh'],e:'Thủy tinh không dẫn điện ⇒ không có dòng Fu-cô ⇒ không sinh nhiệt (nồi nung cũng dùng vật liệu không dẫn điện).',d:s=>{s.on=true;s.ac=true;s.mat='gom';s.T=25;s.melt=0}}
    ]
  };
})();

// ====== Khung chung: thẻ, điều khiển, đố nhanh ======
const SCENES=[SAC,GUITAR,FOU,BEP,PHANH,LO];
let cur=null,paused=false,dragging=false;
const Q={n:0,ok:0};
$('tabs').innerHTML=SCENES.map(s=>`<button role="tab" data-id="${s.id}">${s.tab}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.id,true));

function select(id,push){
  const s=SCENES.find(x=>x.id===id)||SCENES[0];cur=s;
  if(!s.started){s.init();s.started=true}
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===s.id));
  $('ctlTitle').textContent='Thao tác · '+s.title;
  $('ctl').innerHTML=s.controls;s.setup?.();bindControls();
  $('notes').innerHTML=s.notes.map(n=>`<li>${n}</li>`).join('');
  quizIdle();lastExp='';
  if(push)history.replaceState(null,'','#'+s.id);
  document.title=s.title+' – Ứng dụng cảm ứng điện từ';
  hint(s.title);
}
function parse(v){return v==='true'?true:v==='false'?false:isNaN(+v)?v:+v}
function bindControls(){
  const st=()=>cur.get(),root=$('ctl');
  root.querySelectorAll('[data-key]').forEach(el=>{
    const key=el.dataset.key;
    if(el.classList.contains('seg'))el.querySelectorAll('button').forEach(b=>b.onclick=()=>{st()[key]=parse(b.dataset.v);cur.onChange?.call(cur,key)});
    else if(el.tagName==='INPUT'){el.value=st()[key];el.oninput=()=>{st()[key]=+el.value;cur.onChange?.call(cur,key)}}
    else if(el.tagName==='SELECT'){el.value=st()[key];el.onchange=()=>{st()[key]=+el.value;cur.onChange?.call(cur,key)}}
  });
  root.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const k=b.dataset.tog;st()[k]=!st()[k];cur.onChange?.call(cur,k)});
  root.querySelectorAll('[data-chk]').forEach(c=>{c.checked=!!st()[c.dataset.chk];c.onchange=()=>{st()[c.dataset.chk]=c.checked}});
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>cur.act[b.dataset.act].call(cur));
}
function syncControls(){
  const st=cur.get(),root=$('ctl');
  root.querySelectorAll('.seg[data-key]').forEach(el=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(st[el.dataset.key])===b.dataset.v)));
  root.querySelectorAll('input[data-key]').forEach(el=>{if(document.activeElement!==el&&+el.value!==st[el.dataset.key])el.value=st[el.dataset.key]});
  root.querySelectorAll('select[data-key]').forEach(el=>{if(+el.value!==st[el.dataset.key])el.value=st[el.dataset.key]});
  root.querySelectorAll('[data-show]').forEach(el=>{el.textContent=cur.show[el.dataset.show]()});
  root.querySelectorAll('[data-tog]').forEach(b=>{const t=b.dataset.t.split('|');b.textContent=st[b.dataset.tog]?t[0]:t[1];b.classList.toggle('on',!!st[b.dataset.tog])});
}
let lastChips='',lastRes='',lastExp='';
function updateUI(){
  syncControls();
  const c=cur.chips().map(([k,v,cls])=>`<div class="chip ${cls||''}">${k}: <b>${v}</b></div>`).join('');if(c!==lastChips){$('chips').innerHTML=c;lastChips=c}
  const r=cur.res().map(([k,v])=>`<div class="cell"><div class="k">${k}</div><div class="val">${v}</div></div>`).join('');if(r!==lastRes){$('res').innerHTML=r;lastRes=r}
  const e=cur.explain();if(e!==lastExp){$('explain').innerHTML=e;lastExp=e}
  $('bPause').textContent=paused?'▶ Tiếp tục':'⏸ Dừng hình';
}
$('bPause').onclick=()=>{paused=!paused};
$('bReset').onclick=()=>{cur.init();select(cur.id,false);hint('Đã khôi phục ban đầu')};

function quizIdle(){$('qbox').innerHTML='<div class="note">Bấm <b>Câu hỏi mới</b> để nhận câu trắc nghiệm về ứng dụng đang xem. Sau khi trả lời, mô phỏng tự chuyển sang tình huống minh họa.</div>'}
$('bNew').onclick=()=>{
  const pool=cur.quiz,q=pool[Math.floor(Math.random()*pool.length)];
  const idx=q.o.map((_,i)=>i).sort(()=>Math.random()-.5),correct=idx.indexOf(0);let done=false;
  $('qbox').innerHTML=`<div style="display:flex;flex-direction:column;gap:8px"><div class="qtext">${q.q}</div><div class="opts">${idx.map((i,j)=>`<button data-j="${j}">${'ABCD'[j]}. ${q.o[i]}</button>`).join('')}</div><div id="fb"></div></div>`;
  $('qbox').querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
    if(done)return;done=true;const j=+b.dataset.j;Q.n++;if(j===correct)Q.ok++;
    const bs=$('qbox').querySelectorAll('.opts button');bs[correct].classList.add('ok');if(j!==correct)bs[j].classList.add('no');
    $('fb').innerHTML=`<div class="fb ${j===correct?'ok':'no'}"><b>${j===correct?'Chính xác!':'Chưa đúng.'}</b> Đáp án ${'ABCD'[correct]}. ${q.e}</div>`;
    $('score').textContent=`Đúng ${Q.ok} / ${Q.n} câu`;
    q.d(cur.get());cur.onChange?.call(cur,'quiz');hint('Mô phỏng đã chuyển sang tình huống minh họa');
  });
};

// Kéo thả trên hình
cv.addEventListener('pointerdown',e=>{const[x,y]=toLogic(e);if(cur.hit&&cur.hit(x,y)){dragging=true;cur.down(x,y);cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'}});
cv.addEventListener('pointermove',e=>{const[x,y]=toLogic(e);if(dragging)cur.move(x,y);else cv.style.cursor=cur.hit&&cur.hit(x,y)?'grab':'default'});
const endDrag=()=>{if(dragging){dragging=false;cur.up?.call(cur)}cv.style.cursor='default'};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

// ====== Vòng lặp ======
select((location.hash||'').slice(1),false);resize();
window.addEventListener('hashchange',()=>select(location.hash.slice(1),false));
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused)cur.step(dt);
  ctx.clearRect(0,0,cw,ch);ctx.save();ctx.translate(offX,offY);ctx.scale(scale,scale);cur.draw();ctx.restore();
  drawGraph(cur.graph,cur.hist());updateUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
