<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô phỏng Vật lí</title>
<meta name="description" content="Bộ mô phỏng Vật lí tương tác cho học sinh THPT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --line:#dbe2ec; --text:#0f172a; --muted:#64748b;
  --accent:#2563eb; --accent2:#1d4ed8;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
header h1{font-size:28px;margin:0;line-height:1.25}
header p{color:var(--muted);margin:6px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.tools input{flex:1 1 240px;min-width:0;font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tools button{font:inherit;font-size:14px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.tools button.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
.tools button:hover{border-color:var(--accent)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(15,23,42,.06);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(37,99,235,.12)}
.card h3{margin:0;font-size:16.5px;line-height:1.35}
.card p{margin:0;color:#475569;font-size:13.5px}
.lop{align-self:flex-start;font-size:12px;font-weight:600;color:var(--accent2);background:#eff6ff;border:1px solid var(--line);border-radius:20px;padding:1px 9px}
.empty{color:var(--muted);margin-top:24px}
footer{color:var(--muted);font-size:13px;margin-top:40px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mô phỏng Vật lí</h1>
    <p>Các mô phỏng tương tác giúp quan sát hiện tượng và luyện tập theo từng chủ đề.</p>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="Tìm mô phỏng…" aria-label="Tìm mô phỏng">
    <button data-lop="all" class="on">Tất cả</button>
    <button data-lop="10">Lớp 10</button>
    <button data-lop="11">Lớp 11</button>
    <button data-lop="12">Lớp 12</button>
  </div>

  <main id="list"></main>
  <footer>Mở trên máy tính hoặc điện thoại · Mỗi mô phỏng có nút “← Tất cả mô phỏng” để quay lại trang này.</footer>
</div>

<script src="danh-sach.js"></script>
<script>
(()=>{
  const list=document.getElementById('list'),q=document.getElementById('q');
  let lop='all';
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render(){
    const kw=norm(q.value.trim());
    const items=window.MO_PHONG.filter(m=>(lop==='all'||String(m.lop)===lop)&&
      (!kw||norm([m.ten,m.mota,m.chuong,...(m.tags||[])].join(' ')).includes(kw)));
    if(!items.length){list.innerHTML='<p class="empty">Không tìm thấy mô phỏng phù hợp.</p>';return}
    const groups={};
    items.forEach(m=>{(groups[m.chuong]=groups[m.chuong]||[]).push(m)});
    list.innerHTML=Object.entries(groups).map(([ch,ms])=>`<h2>${esc(ch)}</h2><div class="grid">${
      ms.map(m=>`<a class="card" href="${esc(m.file)}"><span class="lop">Lớp ${esc(m.lop)}</span><h3>${esc(m.ten)}</h3><p>${esc(m.mota)}</p></a>`).join('')
    }</div>`).join('');
  }

  document.querySelectorAll('[data-lop]').forEach(b=>b.onclick=()=>{
    lop=b.dataset.lop;
    document.querySelectorAll('[data-lop]').forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
  q.addEventListener('input',render);
  render();
})();
</script>
</body>
</html>
